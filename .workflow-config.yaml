project:
  name: bessa_patterns.ts
  type: typescript-library
  description: Library of Reusable Design Patterns in TypeScript
  kind: configuration_library
  version: 0.12.7-alpha

tech_stack:
  primary_language: typescript
  secondary_languages:
    - javascript
  build_system: npm
  test_framework: jest
  test_command: npm test
  lint_command: npm run lint

structure:
  source_dirs:
    - src
  test_dirs:
    - test
  docs_dirs:
    - docs

workflow:
  stages:
    quick:
      enabled: true
      steps:
        - step_00
        - step_01
        - step_02
    medium:
      enabled: true
      steps:
        - step_00
        - step_01
        - step_02
        - step_03
        - step_04
        - step_05
    full:
      enabled: true
      steps:
        - step_00
        - step_01
        - step_02
        - step_03
        - step_04
        - step_05
        - step_06
        - step_07
        - step_08
        - step_0f

validation:
  documentation:
    required: true
    min_coverage: 80 # Minimum % of public APIs/modules with doc coverage
  testing:
    required: true
    min_coverage: 70 # Minimum % line/branch test coverage

git:
  # Tag creation is owned by the deploy flow (scripts/deploy.sh Step 4/5),
  # which runs after the build so the tag always captures fresh dist/ artifacts.
  # Disable tagging during `run` (step_12) to prevent premature tags.
  tag_on_run: false

deploy:
  enabled: true
  script: scripts/deploy.sh # Invoked by: ai-workflow deploy
  description: Build and publish to npm

skills:
  version_sync:
    skill_doc: .github/skills/sync-version/SKILL.md
    description: >
      Audits and fixes version strings in .workflow-config.yaml and
      docs/ROADMAP.md so they match the canonical version in package.json.
    check_command: >
      node -e "
        const fs = require('fs');
        const pkg = require('./package.json');
        const wf  = fs.readFileSync('.workflow-config.yaml', 'utf8');
        const rm  = fs.readFileSync('docs/ROADMAP.md', 'utf8');
        let ok = true;
        const wfVer = wf.match(/^  version:\s*(\S+)/m)?.[1];
        const rmVer = rm.match(/^## Current State \(v([^)]+)\)/m)?.[1];
        if (wfVer !== pkg.version) { console.error('MISMATCH .workflow-config.yaml: expected ' + pkg.version + ', found ' + wfVer); ok = false; }
        if (rmVer !== pkg.version) { console.error('MISMATCH docs/ROADMAP.md: expected ' + pkg.version + ', found ' + rmVer); ok = false; }
        if (ok) console.log('OK all version strings match ' + pkg.version);
        process.exit(ok ? 0 : 1);
      "
    command: >
      node -e "
        const fs  = require('fs');
        const pkg = require('./package.json');
        let wf = fs.readFileSync('.workflow-config.yaml', 'utf8');
        wf = wf.replace(/^(\s*version:\s*)\S+/m, '\$1' + pkg.version);
        fs.writeFileSync('.workflow-config.yaml', wf);
        let rm = fs.readFileSync('docs/ROADMAP.md', 'utf8');
        rm = rm.replace(/^## Current State \(v[^)]+\)/m, '## Current State (v' + pkg.version + ')');
        fs.writeFileSync('docs/ROADMAP.md', rm);
        console.log('Synced version strings to ' + pkg.version);
      "
